services:
    wordpress:
        image: wordpress:7.1.3-php8.5-apache
        restart: always
        ports:
            - "8089:80"
        env_file: ".env"
        volumes:
            - ./data/wp:/var/www/html
            - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
        depends_on:
            - db

    db:
        image: mariadb:10.11
        restart: always
        env_file: ".env"
        volumes:
            - ./data/mysql:/var/lib/mysql
